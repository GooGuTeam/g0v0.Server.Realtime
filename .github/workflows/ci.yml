name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A superseded run on the same ref has nothing left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: '10.0.x'
  INSPECTCODE_VERSION: '2026.2.1'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: g0v0.Server.Realtime

      # The project reference is ../../g0v0.Server.Common/..., so the sibling checkout has to
      # live next to the repository, exactly like it does on a developer machine.
      - name: Checkout CommonLib
        uses: actions/checkout@v7
        with:
          repository: GooGuTeam/g0v0.Server.Common
          path: g0v0.Server.Common

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: g0v0.Server.Realtime
        run: dotnet restore

      # Only the whitespace formatter runs here, and that is deliberate. The bare `dotnet format`
      # command also runs the style and analyzer fixers, which re-report exactly the diagnostics the
      # build below already fails on: one `MA0006` used to surface as two `error` annotations in this
      # step, two more in the build step, and twice again in the summary. Each gate now owns one
      # thing -- this one owns layout, the build owns analyzer diagnostics.
      #
      # g0v0.Server.Common comes in as a project reference and carries its own style drift, which
      # must not fail this repo's CI. Not using `--include` because it silently turns
      # --verify-no-changes into a no-op.
      - name: Check whitespace formatting
        id: format
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: g0v0.Server.Realtime
        run: >
          dotnet format whitespace g0v0.Server.Realtime.sln --verify-no-changes --no-restore
          --exclude ../g0v0.Server.Common

      # Debug, because that is the configuration `jb inspectcode --no-build` evaluates below.
      # TreatWarningsAsErrors is switched on by Directory.Build.props when CI is set, which also
      # scopes the gate to this repository's projects only.
      - name: Build with analyzers
        id: build
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: g0v0.Server.Realtime
        run: |
          if dotnet build --no-restore --configuration Debug; then
            exit 0
          fi
          echo "::warning::analyzer gate failed; rebuilding with warnings demoted so InspectCode still has assemblies"
          dotnet build --no-restore --configuration Debug \
            -p:TreatWarningsAsErrors=false -p:CodeAnalysisTreatWarningsAsErrors=false
          exit 1

      - name: InspectCode
        id: inspectcode
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: g0v0.Server.Realtime
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools --version "$INSPECTCODE_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p artifacts

          # `TreatWarningsAsErrors` is a build-gate switch and must not leak into the analysis.
          # Directory.Build.props turns it on whenever `CI` is set, and InspectCode then re-maps
          # analyzer severities: measured on this solution, `CI=true` turns 0 findings into 9 CA1822
          # ("member can be made static") that .globalconfig deliberately keeps at `suggestion`.
          # Passing the property here also stops the self-build below from failing on those.
          inspect_args=(--no-updates --severity=WARNING --swea --properties=TreatWarningsAsErrors=false)

          # Reuse the build above when its output is actually there, otherwise let InspectCode build
          # the solution itself. `--no-build` against a missing assembly produces a report full of
          # bogus "cannot resolve symbol" errors.
          if [ -f g0v0.Server.Realtime/bin/Debug/net10.0/g0v0.Server.Realtime.dll ]; then
            inspect_args+=(--no-build)
          else
            echo "::warning::no Debug assembly found; letting InspectCode build the solution"
          fi

          jb inspectcode g0v0.Server.Realtime.sln "${inspect_args[@]}" \
            --output=artifacts/inspectcode.sarif

          # A path that escapes the solution directory belongs to g0v0.Server.Common. Drop it here,
          # once, so the report we upload and the report we gate on are the same file. If the
          # filter itself breaks, fall back to the unfiltered report rather than shipping nothing:
          # a report with foreign findings is still useful, a missing report is not.
          if ! jq '.runs[].results |= map(
                select((.locations[0].physicalLocation.artifactLocation.uri // "") | startswith("../") | not)
              )' artifacts/inspectcode.sarif > artifacts/code-scanning.sarif.tmp; then
            echo "::warning::could not filter the SARIF report; uploading it unfiltered"
            cp artifacts/inspectcode.sarif artifacts/code-scanning.sarif.tmp
          fi
          mv artifacts/code-scanning.sarif.tmp artifacts/code-scanning.sarif

      - name: Upload report to code scanning
        # Fork pull requests get a read-only token and cannot write alerts; the job still gates
        # on the findings below, the report is additionally kept as a plain artifact.
        # `hashFiles` guards the case where InspectCode died before writing anything.
        if: ${{ !cancelled()
          && hashFiles('g0v0.Server.Realtime/artifacts/code-scanning.sarif') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: g0v0.Server.Realtime/artifacts/code-scanning.sarif
          category: resharper-inspectcode
          # The repository is checked out one level down (see "Checkout CommonLib"), so code
          # scanning has to be told where the repository root is or every result is dropped
          # because its path does not resolve inside the repository.
          checkout_path: ${{ github.workspace }}/g0v0.Server.Realtime

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspectcode-report
          path: g0v0.Server.Realtime/artifacts/code-scanning.sarif
          if-no-files-found: ignore

      # The single verdict for this job. Reading `steps.*.outcome` (not `conclusion`) is what makes
      # the `continue-on-error` above harmless: outcome still reports the real failure.
      - name: Inspection summary
        if: ${{ !cancelled() }}
        working-directory: g0v0.Server.Realtime
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspectcode.outcome }}
        run: |
          fail=0
          check() {
            if [ "$2" = "success" ]; then
              printf 'PASS  %-22s\n' "$1"
            else
              printf 'FAIL  %-22s (%s)\n' "$1" "$2"
              fail=1
            fi
          }

          check "format" "$FORMAT_OUTCOME"
          check "build with analyzers" "$BUILD_OUTCOME"
          check "InspectCode" "$INSPECT_OUTCOME"

          # One diagnostic is one line. InspectCode can emit the same problem once per project it
          # analyses a file in, and the printed list has to agree with the number that fails the
          # job -- so the list is de-duplicated once (keyed on file, position and rule; two
          # different rules on the same line are two real problems and stay separate), written to a
          # file, and the count is the line count of that same file.
          if [ -s artifacts/code-scanning.sarif ] && jq -r '[.runs[].results[]
                 | select(.level == "warning" or .level == "error")]
                 | unique_by([(.locations[0].physicalLocation.artifactLocation.uri // ""),
                              (.locations[0].physicalLocation.region.startLine // 0),
                              (.locations[0].physicalLocation.region.startColumn // 0),
                              .ruleId])
                 | .[]
                 | [.level, .ruleId,
                    (.locations[0].physicalLocation.artifactLocation.uri // ""),
                    (.locations[0].physicalLocation.region.startLine // 0),
                    .message.text] | @tsv' artifacts/code-scanning.sarif > artifacts/findings.tsv; then
            cat artifacts/findings.tsv
            problems=$(wc -l < artifacts/findings.tsv)
          else
            echo "::error::InspectCode produced no usable report"
            problems=-1
          fi

          echo "InspectCode problems in this repository: $problems"
          [ "$problems" -eq 0 ] || fail=1
          exit "$fail"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: g0v0.Server.Realtime

      - name: Checkout CommonLib
        uses: actions/checkout@v7
        with:
          repository: GooGuTeam/g0v0.Server.Common
          path: g0v0.Server.Common

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Warnings-as-errors is `code-quality`'s gate and must not leak in here. GitHub exports CI=true,
      # which turns it on in Directory.Build.props, so without this property a formatting slip or an
      # analyzer warning fails this job too.
      - name: Test
        working-directory: g0v0.Server.Realtime
        run: >
          dotnet test --configuration Release
          -p:TreatWarningsAsErrors=false
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: g0v0.Server.Realtime/**/TestResults/**
          retention-days: 30
